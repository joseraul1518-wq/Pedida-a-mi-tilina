<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💖</title>

<style>
body{
margin:0;
font-family:Arial;
background:#ffeef2;
overflow:hidden;
}

/* CONTENEDOR */
.container{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

/* TITULO */
h1{
color:#d63384;
font-size:2.5rem;
}

/* BOTONES */
#si{
background:#ff4d6d;
color:white;
padding:15px 40px;
border:none;
border-radius:50px;
font-size:20px;
cursor:pointer;
}

#no{
position:absolute;
background:gray;
color:white;
padding:10px 20px;
border:none;
border-radius:50px;
cursor:pointer;
}

/* REGALO */
.regalo{
border:4px solid #d63384;
padding:30px;
border-radius:20px;
cursor:pointer;
font-size:22px;
color:#d63384;
background:white;
animation:latido 1.2s infinite, brillo 2s infinite;
box-shadow:0 0 20px rgba(214,51,132,0.4);
}

@keyframes latido{
0%{transform:scale(1);}
50%{transform:scale(1.15);}
100%{transform:scale(1);}
}

@keyframes brillo{
0%{box-shadow:0 0 10px pink;}
50%{box-shadow:0 0 30px hotpink;}
100%{box-shadow:0 0 10px pink;}
}

/* CORAZONES */
.corazon{
position:fixed;
color:#ff4d6d;
font-size:24px;
animation:caer linear forwards;
}

@keyframes caer{
0%{transform:translateY(-10vh);}
100%{transform:translateY(110vh);}
}

.hidden{display:none;}

/* CARTA (PAGINA 3) */
.carta{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,0,0,0.1);
max-width:400px;
text-align:center;
}

.carta a{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#ff4d6d;
color:white;
text-decoration:none;
border-radius:25px;
font-weight:bold;
}
</style>
</head>

<body>

<!-- PANTALLA 1 -->
<div id="p1" class="container">
<h1>¿Quele seguir siendoo Mi Tilinaa? 🥺💗</h1>
<button id="si" onclick="aceptar()">Shii 🥺💗</button>
<button id="no" onmouseover="moverNo()">Ño 💗😭</button>
</div>

<!-- PANTALLA 2 -->
<div id="p2" class="container hidden">
<h1>Tengo un regalo para usted 🎁</h1>
<div class="regalo" onclick="abrir()">🎁<br>Abra el regalo</div>
</div>

<!-- PANTALLA 3 (CARTA) -->
<div id="p3" class="container hidden">
<div class="carta">
<h2>Para ti 💌</h2>
<p>
Esto es solo una pequeña sorpresa...  
pero lo mejor está aquí 👇
</p>

<!-- AQUI PEGAS TU LINK DE LA GALAXIA -->
<a href="AQUI_PEGA_TU_LINK.html" target="_blank">
Ver sorpresa ✨
</a>

</div>
</div>

<script>

let lluviaActiva=false;

/* BOTON NO */
function moverNo(){
let x=Math.random()*window.innerWidth;
let y=Math.random()*window.innerHeight;
document.getElementById("no").style.left=x+"px";
document.getElementById("no").style.top=y+"px";
}

/* CORAZONES */
function crearCorazones(){
if(!lluviaActiva) return;

let c=document.createElement("div");
c.className="corazon";
c.innerHTML="💖";

c.style.left=Math.random()*100+"vw";
c.style.animationDuration=(2+Math.random()*3)+"s";

document.body.appendChild(c);

setTimeout(()=>c.remove(),4000);
setTimeout(crearCorazones,200);
}

/* ACEPTAR */
function aceptar(){
lluviaActiva=true;
crearCorazones();

setTimeout(()=>{
document.getElementById("p1").classList.add("hidden");
document.getElementById("p2").classList.remove("hidden");
},800);
}

/* ABRIR REGALO */
function abrir(){
lluviaActiva=false;

document.getElementById("p2").classList.add("hidden");
document.getElementById("p3").classList.remove("hidden");
}

</script>

</body>
</html>
